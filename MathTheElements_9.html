// ── MUSIC ENGINE (Web Audio API – no external files needed) ──
const MusicEngine = (function(){
  let ctx, masterGain, playing=false, notes=[], noteIdx=0, interval=null;
  const SCALE=[261.63,293.66,329.63,349.23,392,440,493.88,523.25];
  const BATTLE_MELODY=[0,2,4,5,4,2,0,2,4,7,5,4,2,0,4,5,7,5,4,2,0,2,5,4];
  const TITLE_MELODY =[4,5,7,5,4,2,0,2,4,5,7,9,7,5,4,5,7,5,2,0];

  function init(){
    if(ctx) return;
    ctx = new (window.AudioContext||window.webkitAudioContext)();
    masterGain = ctx.createGain();
    masterGain.gain.value = 0.18;
    masterGain.connect(ctx.destination);
  }
  function playNote(freq, dur, vol=0.18, type='triangle'){
    if(!ctx||!playing) return;
    const osc=ctx.createOscillator();
    const g=ctx.createGain();
    osc.type=type;
    osc.frequency.value=freq;
    g.gain.setValueAtTime(vol,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+dur);
    osc.connect(g); g.connect(masterGain);
    osc.start(ctx.currentTime); osc.stop(ctx.currentTime+dur);
  }
  function startMelody(melody, bpm=120){
    stopAll();
    playing=true; noteIdx=0; notes=melody;
    const beat=60000/bpm;
    interval=setInterval(()=>{
      if(!playing) return;
      const n=notes[noteIdx%notes.length];
      const freq=SCALE[n%8]*(n>=8?2:1);
      playNote(freq, beat/900, 0.15);
      noteIdx++;
    },beat/2);
  }
  function stopAll(){
    playing=false;
    if(interval){clearInterval(interval);interval=null;}
  }
  function toggle(){
    if(!ctx) init();
    if(playing){ stopAll(); return false; }
    else{ startMelody(TITLE_MELODY,100); return true; }
  }
  function setBattle(){ if(playing){ startMelody(BATTLE_MELODY,140); } }
  function setTitle(){ if(playing){ startMelody(TITLE_MELODY,100); } }
  function isPlaying(){ return playing; }
  return {init,toggle,setBattle,setTitle,isPlaying};
})();

document.getElementById('musicBtn').addEventListener('click',()=>{
  MusicEngine.init();
  const on=MusicEngine.toggle();
  document.getElementById('musicBtn').textContent=on?'🔊':'🔇';
});

function startGame(world){
  GS.world=world;
  GS.screen='battle';
  GS.hp=100; GS.maxHp=100;
  GS.monstHp=60+world*20; GS.maxMhp=GS.monstHp;
  GS.streak=0; GS.combo=0; GS.coins=0; GS.xp=0;
  GS.xpNeeded=100; GS.playerLvl=1; GS.totalCorrect=0;
  const pool=ALL_QUESTIONS[String(GS.grade)]?.[String(world)]||ALL_QUESTIONS[String(GS.grade)]?.['1']||[];
  GS.questions=[...pool].sort(()=>Math.random()-0.5);
  GS.qIdx=0; GS.answered=false;
  MusicEngine.setBattle();
  showBattle();
}

function showBattle(){
  const e=GS.element;
  const q=GS.questions[GS.qIdx];

      </div>
      <div style="display:flex;align-items:center;gap:7px">
        <span style="font-size:9px;color:${e.color};width:18px">XP</span>
        <div class="hbar-track" style="flex:1;height:6px"><div class="hbar-fill" style="width:${xpPct}%;background:${e.color}88"></div></div>
      </div>
    </div>

    <!-- Arena -->
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:8px 10px;min-height:0;overflow:hidden">
      <!-- Monster HP -->
      <div style="width:100%;max-width:320px">
        <div style="display:flex;justify-content:space-between;margin-bottom:3px">
          <span style="font-size:10px;color:rgba(255,100,100,0.8)">${e.monsterEmoji||'👾'} ${e.monsterName}</span>
          <span style="font-size:10px;color:rgba(255,100,100,0.8)">${GS.monstHp}/${GS.maxMhp}</span>
        </div>
        <div class="hbar-track"><div class="hbar-fill" style="width:${mhpPct}%;background:linear-gradient(90deg,${mhpColor},${mhpColor}88)"></div></div>
      </div>

      <!-- Sprites row -->
      <div style="display:flex;justify-content:space-around;align-items:flex-end;width:100%;padding:0 8px">
        <div style="display:flex;flex-direction:column;align-items:center;gap:3px">
          <div style="width:68px;height:78px;animation:guardianFloat 2s ease-in-out infinite;filter:drop-shadow(0 0 10px ${e.color})">${SPRITES[e.guardianSprite]||''}</div>
          <div style="font-size:9px;color:${e.color}99;max-width:80px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${GS.playerName}</div>
          ${GS.combo>1?`<div style="font-size:9px;color:#FFD700;animation:pulse 0.6s ease-in-out infinite">🔥×${GS.combo}</div>`:''}
        </div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:3px">
          <div class="elem-orb ${e.cssClass}" style="width:30px;height:30px;font-size:12px">${e.emoji}</div>

        </div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:3px">

function checkAnswer(btn, chosen, correct, idx){
  if(GS.answered) return;
  GS.answered=true;
  const isCorrect=chosen===correct;
  if(isCorrect){
    GS.streak++; GS.combo++;
    const dmg=15+(GS.combo>1?GS.combo*3:0);
    GS.monstHp=Math.max(0,GS.monstHp-dmg);
    GS.xp+=10+GS.streak*2; GS.coins+=3+GS.streak;
    GS.totalCorrect++;
    if(GS.xp>=GS.xpNeeded){GS.playerLvl++;GS.xp=0;GS.xpNeeded=Math.floor(GS.xpNeeded*1.3);}
    btn.style.background='rgba(0,150,0,0.75)';
    btn.style.border='2px solid #4CAF50';
    btn.style.transform='scale(1.04)';
    showFloatText('+'+dmg+'⚔️','#FFD700');
  } else {
    GS.streak=0; GS.combo=0;
    GS.hp=Math.max(0,GS.hp-18);
    btn.style.background='rgba(180,0,0,0.75)';
    btn.style.border='2px solid #f44336';
    document.querySelectorAll('[id^="ans_"]').forEach(b=>{
      if(b.textContent.trim()===correct){b.style.background='rgba(0,120,0,0.75)';b.style.border='2px solid #4CAF50';}
    });
    showFloatText('-18❤️','#f44336');
    const root=document.getElementById('battleRoot');
    if(root){root.style.animation='shake 0.4s ease';setTimeout(()=>{if(root)root.style.animation='';},400);}
  }
  document.querySelectorAll('[id^="ans_"]').forEach(b=>{b.onclick=null;b.style.cursor='default';});
  setTimeout(()=>{
    if(GS.hp<=0){showDefeat();return;}
    if(GS.monstHp<=0){showVictory();return;}
    GS.qIdx++;
    if(GS.qIdx>=GS.questions.length){showVictory();return;}
    showBattle();
  },isCorrect?900:1200);
}

function showFloatText(txt,color){
  const d=document.createElement('div');
  d.style.cssText=`position:fixed;top:42%;left:50%;transform:translate(-50%,-50%);font-size:26px;font-weight:bold;color:${color};pointer-events:none;z-index:999;animation:dmgFloat 0.9s ease forwards;text-shadow:0 2px 8px rgba(0,0,0,0.8)`;
  d.textContent=txt;
  document.body.appendChild(d);
  setTimeout(()=>d.remove(),900);
}

      <button onclick="showWorldSelect('${e.id}')" style="background:rgba(0,0,0,0.4);border:1px solid ${e.color}22;color:${e.color}88;padding:11px 20px;border-radius:22px;font-size:13px">🗺️ World Map</button>
      <button onclick="showTitle()" style="background:rgba(0,0,0,0.35);border:1px solid rgba(255,228,181,0.12);color:rgba(255,228,181,0.35);padding:11px 20px;border-radius:22px;font-size:13px">🏠 Home</button>
