// All sounds generated via Web Audio API — no external files
// Design: warm acoustic guitar-style plucks + gentle string pads + soft piano tones
const SFX=(()=>{
  let ctx=null,loops=[],ai=null,muted=false;
  function ac(){
    try{
      if(!ctx){ctx=new(window.AudioContext||window.webkitAudioContext)();}
      if(ctx.state==='suspended'){ctx.resume();}
      return ctx;
    }catch(e){return null;}
  }
  // Acoustic guitar pluck: two oscillators with fast attack decay + slight detune
  function pluck(freq,vol,delay,pan){
    if(muted)return;
    delay=delay||0;pan=pan||0;
    try{
      const c=ac();if(!c)return;
      const t=c.currentTime+delay;
      // Primary tone
      const o1=c.createOscillator(),g1=c.createGain();
      o1.type='triangle';o1.frequency.value=freq;
      o1.frequency.setTargetAtTime(freq*0.998,t,0.15); // gentle pitch drift
      g1.gain.setValueAtTime(0,t);
      g1.gain.linearRampToValueAtTime(vol,t+0.005); // very fast attack
      g1.gain.exponentialRampToValueAtTime(vol*0.3,t+0.08);
      g1.gain.exponentialRampToValueAtTime(0.0001,t+1.6); // long natural decay
      // Slight harmonic shimmer
      const o2=c.createOscillator(),g2=c.createGain();
      o2.type='sine';o2.frequency.value=freq*2.003; // slight detuned octave
      g2.gain.setValueAtTime(0,t);
      g2.gain.linearRampToValueAtTime(vol*0.18,t+0.004);
      g2.gain.exponentialRampToValueAtTime(0.0001,t+0.6);
      // Panning
      if(c.createStereoPanner){
        const sp=c.createStereoPanner();sp.pan.value=pan;
        o1.connect(g1);g1.connect(sp);sp.connect(c.destination);
        const sp2=c.createStereoPanner();sp2.pan.value=pan*0.5;
        o2.connect(g2);g2.connect(sp2);sp2.connect(c.destination);
      }else{
        o1.connect(g1);g1.connect(c.destination);
        o2.connect(g2);g2.connect(c.destination);
      }
      o1.start(t);o1.stop(t+1.7);
      o2.start(t);o2.stop(t+0.65);
    }catch(e){}
  }
  // Soft piano-style tone: shorter decay, warmer
  function piano(freq,vol,delay,pan){
    if(muted)return;
    delay=delay||0;pan=pan||0;
    try{
      const c=ac();if(!c)return;
      const t=c.currentTime+delay;
      const o=c.createOscillator(),g=c.createGain();
      o.type='sine';o.frequency.value=freq;
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(vol,t+0.008);
      g.gain.exponentialRampToValueAtTime(vol*0.4,t+0.12);
      g.gain.exponentialRampToValueAtTime(0.0001,t+2.2);
      // Soft body resonance
      const o2=c.createOscillator(),g2=c.createGain();
      o2.type='triangle';o2.frequency.value=freq*1.5;
      g2.gain.setValueAtTime(0,t);
      g2.gain.linearRampToValueAtTime(vol*0.08,t+0.01);
      g2.gain.exponentialRampToValueAtTime(0.0001,t+0.5);
      if(c.createStereoPanner){
        const sp=c.createStereoPanner();sp.pan.value=pan;
        o.connect(g);g.connect(sp);sp.connect(c.destination);
        o2.connect(g2);g2.connect(c.destination);
      }else{
        o.connect(g);g.connect(c.destination);
        o2.connect(g2);g2.connect(c.destination);
      }
      o.start(t);o.stop(t+2.3);
      o2.start(t);o2.stop(t+0.55);
    }catch(e){}
  }
  // Gentle string pad: slow attack, long sustain
  function pad(freq,vol,dur,delay){
    if(muted)return;
    delay=delay||0;
    try{
      const c=ac();if(!c)return;
      const t=c.currentTime+delay;
      const o=c.createOscillator(),g=c.createGain();
      o.type='sine';o.frequency.value=freq;
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(vol,t+0.8); // slow string attack
      g.gain.setValueAtTime(vol,t+dur-0.5);
      g.gain.linearRampToValueAtTime(0,t+dur);
      if(c.createStereoPanner){const sp=c.createStereoPanner();sp.pan.value=(Math.random()-.5)*.4;o.connect(g);g.connect(sp);sp.connect(c.destination);}
      else{o.connect(g);g.connect(c.destination);}
      o.start(t);o.stop(t+dur+0.1);
    }catch(e){}
  }
  function stopAll(){
    loops.forEach(l=>{try{clearInterval(l);}catch(e){}});
    loops=[];

function h(tag,attrs,children){
  attrs=attrs||{};children=children||[];
  const el=document.createElement(tag);
  for(const[k,v] of Object.entries(attrs)){
    if(k==='style'&&typeof v==='object')Object.assign(el.style,v);
    else if(k.startsWith('on')&&typeof v==='function')el.addEventListener(k.slice(2).toLowerCase(),v);
    else el.setAttribute(k,v);
  }
  for(const c of[].concat(children)){
    if(c==null||c===false)continue;
    el.appendChild(typeof c==='string'?document.createTextNode(c):c);
  }
  return el;
}
function hbar(label,cur,max,color,glow){
  const pct=Math.max(0,Math.min(100,(cur/max)*100));
  const wrap=h('div',{style:{marginBottom:'6px'}});
  wrap.appendChild(h('div',{style:{display:'flex',justifyContent:'space-between',fontSize:'10px',color:'#aaa',marginBottom:'2px'}},[h('span',{},[label]),h('span',{style:{color:pct>50?'#90EE90':pct>25?'#FFD700':'#FF4444'}},[Math.ceil(cur)+'/'+max])]));
  const track=h('div',{class:'hbar-track'});
  track.appendChild(h('div',{class:'hbar-fill',style:{width:pct+'%',background:color,boxShadow:'0 0 6px '+glow}}));
  track.appendChild(h('div',{class:'hbar-txt'},[Math.round(pct)+'%']));
  wrap.appendChild(track);
  return wrap;
}

function handleNodeAction(node){
  if(node.type==='start'){const ni=DEFAULT_PATH[1];G.path=[0,ni];G.currentNodeId=ni;save();render();return;}
  if(node.type==='village'){G.activeVillage=getVillage(node.vid);G.screen='village';SFX.village();render();return;}
  if(node.type==='treasure'){G.player.gold+=35;G.result={won:true,xp:0,treasure:true};G.screen='result';SFX.victory();render();return;}
  if(node.type==='monster'||node.type==='boss'){
    const m=getMonster(node.mid);
    G.combat={monster:{...m,curHp:m.hp},question:getQ(G.player.grade,G.level),selected:null,result:null,showHint:false,paused:false,playerHp:G.player.energy,streak:0,turn:0,dmgText:null,dmgSide:null,monsterTurn:false};
    G.screen='combat';
    if(node.boss||node.final)SFX.boss();else SFX.battle();
    render();return;
  }
}

function advanceOrBranch(){
  const branches=BRANCH_MAP[G.currentNodeId];
  if(branches){G.pendingBranch=branches;G.screen='branch';save();render();}
  else{
    const ci=DEFAULT_PATH.indexOf(G.currentNodeId);
    const ni=ci>=0?DEFAULT_PATH[ci+1]:null;
    if(ni!=null){G.path=[...G.path,ni];G.currentNodeId=ni;G.level=Math.min(5,Math.ceil(G.path.length/2));save();SFX.explore();render();}
    else{G.screen='boss_victory';render();}
  }
}

function handleAnswer(idx,choice){
  if(!G.combat)return; // guard: combat may have been cleared by flee/error
  const cb=G.combat,p=G.player;
  if(cb.result||cb.monsterTurn)return; // prevent double-fire
  const correct=choice===cb.question.a;
  cb.selected=idx;
  if(correct){
    SFX.correct();SFX.staff();
    const pathBonus=p.path==='warrior'?5:0;
    const sm=p.path==='rogue'?2:1;
    const dmg=15+cb.streak*3*sm+pathBonus;
    cb.monster.curHp=Math.max(0,cb.monster.curHp-dmg);
    cb.result='correct';cb.streak++;
    cb.dmgText=String(dmg);cb.dmgSide='monster';
    const heal=Math.min(10,p.maxEnergy-cb.playerHp);
    if(heal>0){cb.playerHp=Math.min(p.maxEnergy,cb.playerHp+heal);cb.healText=heal;}else{cb.healText=0;}
    if(p.path==='healer'){const h2=Math.min(2,p.maxEnergy-cb.playerHp);cb.playerHp=Math.min(p.maxEnergy,cb.playerHp+h2);}
    render();
    if(cb.monster.curHp<=0){
      SFX.victory();
      setTimeout(()=>{
        if(G.combat!==cb)return; // stale closure guard
        G.player.gold+=cb.monster.xp;G.player.energy=cb.playerHp;
        G.monstersKilled++;G.result={won:true,xp:cb.monster.xp};
        G.screen='result';G.combat=null;save();render();
      },1300);
    }else{
      setTimeout(()=>{if(G.combat===cb)nextTurn();},1400);
    }
  }else{
    SFX.wrong();cb.result='wrong';cb.streak=0;cb.dmgText=null;cb.healText=0;
    render();
    setTimeout(()=>{
      if(G.combat!==cb)return; // stale closure guard
      cb.monsterTurn=true;
      const dmg=rand(cb.monster.atkMin||5,cb.monster.atkMax||15);
      cb.playerHp=Math.max(0,cb.playerHp-dmg);
      cb.dmgText=String(dmg);cb.dmgSide='player';cb.healText=0;
      SFX.monster();render();
      if(cb.playerHp<=0){
        SFX.defeat();
        setTimeout(()=>{
          if(G.combat!==cb)return; // stale closure guard
          G.player.energy=0;G.result={won:false,xp:0};
          G.screen='result';G.combat=null;save();render();
        },1500);
      }else{
        setTimeout(()=>{if(G.combat===cb)nextTurn();},1600);
      }
    },900);
  }
}
function nextTurn(){
  const cb=G.combat;if(!cb)return;
  cb.result=null;cb.selected=null;cb.showHint=false;cb.dmgText=null;cb.healText=0;cb.dmgSide=null;cb.monsterTurn=false;
  cb.turn++;cb.question=getQ(G.player.grade,G.level);
  G.player.energy=cb.playerHp;
  render();
}

  for(let i=0;i<22;i++)div.appendChild(h('div',{style:{position:'absolute',left:Math.random()*90+'%',top:Math.random()*60+'%',fontSize:(10+Math.random()*14)+'px',animation:`floatUp ${2+Math.random()*3}s ${Math.random()*2}s infinite ease-in-out`,opacity:'.8',pointerEvents:'none'}},['✨']));
  div.appendChild(h('div',{style:{fontSize:'60px',marginBottom:'10px',animation:'pulse 1.5s infinite',position:'relative',zIndex:'1'}},['🏆']));
  div.appendChild(h('div',{style:{fontSize:'24px',fontWeight:'900',color:'#FFD700',marginBottom:'5px',textShadow:'0 0 20px #FFD700',position:'relative',zIndex:'1'}},['STAGE '+G.stage+' COMPLETE!']));
  div.appendChild(h('div',{style:{fontSize:'13px',color:'#C0A060',marginBottom:'7px',fontStyle:'italic',position:'relative',zIndex:'1'}},['The Storm Drake is defeated!']));
  const stats=h('div',{style:{background:'rgba(255,215,0,.08)',border:'1px solid rgba(255,215,0,.25)',borderRadius:'12px',padding:'14px 20px',marginBottom:'20px',width:'100%',maxWidth:'270px',position:'relative',zIndex:'1'}});
  stats.appendChild(h('div',{style:{color:'#FFD700',fontSize:'11px',letterSpacing:'2px',marginBottom:'9px',textAlign:'center'}},['✦ STAGE '+G.stage+' RESULTS ✦']));
  [['Monsters Defeated',G.monstersKilled,'#90EE90'],['Gold Collected',p.gold,'#FFD700'],['Energy',p.energy+'/'+p.maxEnergy,p.energy>8?'#90EE90':'#FF6B35'],['Stage','Stage '+G.stage,'#C080FF']].forEach(([l,v,c])=>stats.appendChild(h('div',{style:{display:'flex',justifyContent:'space-between',fontSize:'12px',color:'#C0A060',marginBottom:'3px'}},[h('span',{},[l+':']),h('span',{style:{color:c,fontWeight:'700'}},[String(v)])])));
  div.appendChild(stats);
  const nb=h('button',{style:{padding:'14px 32px',borderRadius:'12px',background:`linear-gradient(135deg,${el.c},${el.g})`,border:'none',color:'#000',cursor:'pointer',fontWeight:'700',fontSize:'15px',boxShadow:`0 0 20px ${el.g}77`,marginBottom:'10px',position:'relative',zIndex:'1'}},['⚔️ Begin Stage '+(G.stage+1)]);
  nb.addEventListener('click',()=>{G.stage++;G.level=1;G.path=[0];G.currentNodeId=0;initQUsed();G.screen='main';SFX.explore();save();render();});
  const mb=h('button',{style:{padding:'10px 24px',borderRadius:'10px',background:'rgba(255,255,255,.06)',border:'1px solid rgba(255,255,255,.18)',color:'#aaa',cursor:'pointer',fontSize:'12px',position:'relative',zIndex:'1'}},['🏠 Main Menu']);
  mb.addEventListener('click',()=>{CC={step:0,name:'',gender:null,element:null,path:null,grade:null};G.screen='create';render();});
  div.appendChild(nb);div.appendChild(mb);gr.appendChild(div);
}

// ═══ AD ═══
function renderAd(){
  SFX.stopAll();let cd=5;
  const div=h('div',{style:{position:'absolute',inset:'0',background:'#000',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',zIndex:'200'}});
  div.appendChild(h('div',{style:{position:'absolute',top:'10px',right:'12px',color:'#444',fontSize:'10px',letterSpacing:'1px'}},['ADVERTISEMENT']));
  const ab=h('div',{style:{width:'88%',maxWidth:'340px',background:'linear-gradient(135deg,#0a0030,#002044)',borderRadius:'16px',display:'flex',flexDirection:'column',alignItems:'center',gap:'12px',padding:'40px 24px',border:'2px solid rgba(100,150,255,.2)',minHeight:'300px'}});
  ab.appendChild(h('div',{style:{fontSize:'48px'}},['🏰']));
  ab.appendChild(h('div',{style:{fontSize:'20px',color:'#FFD700',fontWeight:'700',textAlign:'center'}},['Epic Quest Awaits!']));
  ab.appendChild(h('div',{style:{fontSize:'12px',color:'#aaa',textAlign:'center',lineHeight:'1.6'}},['More stages, more monsters, more math mastery!']));
  ab.appendChild(h('div',{style:{padding:'11px 26px',borderRadius:'22px',background:'linear-gradient(135deg,#FF6B35,#FFD700)',color:'#000',fontWeight:'700',fontSize:'14px'}},['Play Now →']));
  div.appendChild(ab);
  const sw=h('div',{style:{marginTop:'18px',minHeight:'38px',display:'flex',alignItems:'center',justifyContent:'center'}});
  const sl=h('div',{style:{color:'#444',fontSize:'12px'}},['Skip in 5s...']);
  sw.appendChild(sl);div.appendChild(sw);gr.appendChild(div);
  const iv=setInterval(()=>{cd--;if(cd<=0){clearInterval(iv);sw.innerHTML='';const sb=h('button',{style:{padding:'10px 28px',borderRadius:'8px',background:'rgba(255,255,255,.12)',border:'1px solid rgba(255,255,255,.25)',color:'#fff',cursor:'pointer',fontSize:'13px'}},['✕ Close Ad']);sb.addEventListener('click',()=>{G.screen='main';SFX.explore();advanceOrBranch();});sw.appendChild(sb);}else{sl.textContent='Skip in '+cd+'s...';}},1000);
}

// ═══ INVENTORY ═══
function renderInventory(){
  const p=G.player,el=getEl(p.element);
  const ov=h('div',{style:{position:'absolute',inset:'0',background:'rgba(0,0,0,.88)',backdropFilter:'blur(6px)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:'90',padding:'14px'}});
  const card=h('div',{style:{background:'rgba(8,4,1,.95)',borderRadius:'14px',padding:'16px',border:`1px solid ${el.c}55`,maxWidth:'370px',width:'100%',maxHeight:'82vh',overflowY:'auto',boxShadow:`0 0 30px ${el.g}22`}});
  const hd=h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'14px'}});
  hd.appendChild(h('div',{style:{fontSize:'15px',fontWeight:'700',color:el.c}},['🎒 Inventory & Stats']));
  const cb=h('button',{style:{padding:'3px 9px',borderRadius:'6px',background:'rgba(255,255,255,.08)',border:'1px solid rgba(255,255,255,.15)',color:'#aaa',cursor:'pointer',fontSize:'12px'}},['✕']);
  cb.addEventListener('click',()=>{G.showInventory=false;SFX.click();render();});
  hd.appendChild(cb);card.appendChild(hd);
  const pd=PATHS[p.path];
  card.appendChild(h('div',{style:{padding:'9px 11px',borderRadius:'9px',background:`${el.c}18`,border:`1px solid ${el.c}33`,marginBottom:'11px'}},[h('div',{style:{display:'flex',alignItems:'center',gap:'7px'}},[h('span',{style:{fontSize:'20px'}},[pd?.icon||'⚔️']),h('div',{},[h('div',{style:{fontWeight:'700',fontSize:'12px',color:el.c}},[pd?.label+' Path']),h('div',{style:{fontSize:'10px',color:'#888'}},[pd?.bonus])])])]));
  card.appendChild(h('div',{style:{color:'#C0A060',fontSize:'11px',marginBottom:'7px'}},['🎭 Disguises ('+p.disguises.length+')']));
  if(p.disguises.length>0){p.disguises.forEach(did=>{const d=DISGUISES.find(x=>x.id===did);if(d)card.appendChild(h('div',{style:{display:'flex',alignItems:'center',gap:'7px',padding:'6px 9px',borderRadius:'7px',background:'rgba(255,215,0,.06)',border:'1px solid rgba(255,215,0,.14)',marginBottom:'4px'}},[h('span',{style:{fontSize:'18px'}},[d.s]),h('div',{},[h('div',{style:{fontSize:'11px',color:'#FFE4B5'}},[d.n]),h('div',{style:{fontSize:'9px',color:'#888'}},['Entry to '+EL[d.el].name+' villages'])])]));})}
  else card.appendChild(h('div',{style:{color:'#444',fontSize:'10px',fontStyle:'italic',marginBottom:'7px'}},['No disguises found yet']));
  card.appendChild(h('div',{style:{padding:'9px 11px',borderRadius:'9px',background:'rgba(255,255,255,.04)',border:'1px solid rgba(255,255,255,.08)',marginTop:'7px'}},[
    h('div',{style:{color:'#aaa',fontSize:'10px',marginBottom:'5px'}},['📊 Adventure Stats']),
    ...[['Stage',G.stage,'#C080FF'],['Level',G.level,el.c],['Monsters',G.monstersKilled,'#90EE90'],['Gold',p.gold,'#FFD700'],['Energy',`${p.energy}/${p.maxEnergy}`,p.energy>8?'#90EE90':'#FF6B35'],['Grade','Grade '+p.grade,'#C0A060']].map(([l,v,c])=>h('div',{style:{display:'flex',justifyContent:'space-between',fontSize:'11px',color:'#888',marginBottom:'2px'}},[h('span',{},[l+':']),h('span',{style:{color:c}},[String(v)])]))
  ]));
  ov.appendChild(card);gr.appendChild(ov);
}

// ═══ RESPONSIVE BOOT ═══
function initResponsive(){
  const isMobile=window.innerWidth<=600||'ontouchstart' in window;
  const gr=document.getElementById('gr');
  const app=document.getElementById('app');
  if(!isMobile){
    // Desktop: center a phone-sized frame
    app.style.background='#1a1008';
    app.style.backgroundImage='radial-gradient(ellipse at 50% 30%,#2a1808 0%,#0a0500 100%)';
    gr.style.maxWidth='420px';
    gr.style.maxHeight='860px';
    gr.style.borderRadius='24px';
    gr.style.boxShadow='0 0 80px rgba(0,0,0,.9),0 0 40px rgba(255,140,0,.1)';
    gr.style.border='1px solid rgba(255,140,0,.15)';
    // Add desktop label
    const label=document.createElement('div');
    label.style.cssText='position:fixed;top:12px;left:50%;transform:translateX(-50%);color:rgba(255,140,0,.4);font-size:11px;letter-spacing:2px;font-family:Palatino,serif;pointer-events:none';
    label.textContent='✦ MATH: THE ELEMENTS ✦';
    document.body.appendChild(label);
  }else{
    // Mobile: fill screen
    gr.style.maxWidth='100%';
    gr.style.maxHeight='100%';
    gr.style.borderRadius='0';
  }
}
initResponsive();
render();
</script>
