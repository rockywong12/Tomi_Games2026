<title>Math: The Elements — Rev 8</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;width:100%;overflow:hidden;background:#050300}
body{font-family:'Palatino Linotype','Book Antiqua',Palatino,serif;color:#FFE4B5}
#app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.game-root{position:relative;width:100%;height:100%;overflow:hidden;max-width:480px;max-height:900px;box-shadow:0 0 60px rgba(0,0,0,.8)}
button{font-family:inherit;cursor:pointer;border:none;outline:none}
input{font-family:inherit;outline:none}

@keyframes floatUp{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes dmgFloat{0%{opacity:1;transform:translateY(0) scale(1.3)}100%{opacity:0;transform:translateY(-55px) scale(0.8)}}
@keyframes leafFall{0%{transform:translateY(-5px) rotate(0);opacity:.8}100%{transform:translateY(65px) rotate(200deg);opacity:0}}
@keyframes starTwinkle{0%,100%{opacity:.2}50%{opacity:.9}}
@keyframes titleGlow{0%,100%{filter:drop-shadow(0 0 10px #FF8C00)}50%{filter:drop-shadow(0 0 28px #FFD700)}}
@keyframes guardianFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes monsterBob{0%,100%{transform:scaleX(-1) translateY(0)}50%{transform:scaleX(-1) translateY(-5px)}}
@keyframes fistPunch{0%,100%{transform:scaleX(-1) translateX(0)}50%{transform:scaleX(-1) translateX(-12px)}}
@keyframes swingSt{0%,100%{transform:rotate(-15deg) translateY(0)}50%{transform:rotate(15deg) translateY(-4px)}}
@keyframes orbPulse{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(1.15);opacity:1}}
@keyframes runeFloat{0%{transform:translateY(0) rotate(0deg);opacity:0.6}50%{transform:translateY(-12px) rotate(180deg);opacity:1}100%{transform:translateY(0) rotate(360deg);opacity:0.6}}
@keyframes elementalAura{0%,100%{box-shadow:0 0 15px currentColor}50%{box-shadow:0 0 35px currentColor,0 0 60px currentColor}}
@keyframes crystalSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes victoryBurst{0%{transform:scale(0);opacity:1}100%{transform:scale(3);opacity:0}}

.hbar-track{background:rgba(0,0,0,.6);border-radius:6px;height:12px;border:1px solid rgba(255,255,255,.15);overflow:hidden;position:relative}
.hbar-fill{height:100%;border-radius:6px;transition:width .4s ease}
.hbar-txt{position:absolute;right:5px;top:0;font-size:9px;line-height:12px;color:rgba(255,255,255,.8);font-family:monospace}

::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:rgba(255,200,100,.3)}

/* Rev 8: Enhanced element orb styles */
.elem-orb{
  width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:28px;animation:orbPulse 2s ease-in-out infinite;
  box-shadow:0 0 20px currentColor;position:relative;
}
.elem-orb::after{
  content:'';position:absolute;inset:-4px;border-radius:50%;
  border:2px solid currentColor;opacity:0.4;animation:crystalSpin 4s linear infinite;
  border-style:dashed;
}
.elem-fire{color:#FF6B35;background:radial-gradient(circle,#3a1200,#1a0800)}
.elem-water{color:#4FC3F7;background:radial-gradient(circle,#001a3a,#000d1a)}
.elem-earth{color:#81C784;background:radial-gradient(circle,#0d2a0d,#071407)}
.elem-lightning{color:#FFD54F;background:radial-gradient(circle,#2a2000,#1a1400)}
.elem-ice{color:#B3E5FC;background:radial-gradient(circle,#001a2a,#000d1a)}
.elem-shadow{color:#CE93D8;background:radial-gradient(circle,#1a0028,#0d0014)}
.elem-metal{color:#CFD8DC;background:radial-gradient(circle,#1a1e20,#0d1012)}
.elem-nature{color:#A5D6A7;background:radial-gradient(circle,#0d2010,#071008)}

/* Rev 8: Enhanced monster/guardian frames */
.sprite-frame{
  background:rgba(0,0,0,0.3);border-radius:12px;
  border:1px solid rgba(255,255,255,0.08);
  padding:6px;position:relative;overflow:hidden;
}
.sprite-frame::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,0.03),transparent);
  border-radius:12px;
}

/* Rev 8: Rune particle effect */
.rune-particle{
  position:absolute;font-size:14px;pointer-events:none;
  animation:runeFloat 3s ease-in-out infinite;
  opacity:0.6;
}
</style>

function startGame(world){
  GS.world = world;
  GS.screen='battle';
  GS.hp = 100; GS.maxHp = 100;
  GS.monstHp = 60 + world*20;
  GS.maxMhp = GS.monstHp;
  GS.streak = 0; GS.combo = 0;
  GS.coins = 0; GS.xp = 0;
  GS.totalCorrect = 0; GS.totalWrong = 0;
  GS.xpNeeded = 100; GS.playerLvl = 1;
  const questKey = String(GS.grade);
  const worldKey = String(world);
  const pool = ALL_QUESTIONS[questKey]?.[worldKey] || ALL_QUESTIONS[questKey]?.['1'] || [];
  GS.questions = [...pool].sort(()=>Math.random()-0.5).slice(0,10);
  GS.qIdx = 0;
  GS.answered = false;
  showBattle();
}

        <div style="font-size:11px;color:#FFD700">
          🪙${GS.coins} &nbsp; ⚡Lv${GS.playerLvl}
        </div>
      </div>

        <span style="font-size:10px;color:#FFE4B5;width:20px">${e.guardianEmoji}</span>
        <div class="hbar-track" style="flex:1">
          <div class="hbar-fill" style="width:${hpPct}%;background:linear-gradient(90deg,${hpColor},${hpColor}88)"></div>

        </div>
      </div>
      <!-- XP bar -->
      <div style="display:flex;align-items:center;gap:8px">

          <div class="hbar-fill" style="width:${xpPct}%;background:linear-gradient(90deg,${e.color},${e.color}66)"></div>
        </div>
      </div>
    </div>

    <!-- Battle arena -->
    <div style="flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px;min-height:0">
      
      <!-- Rune particles -->
      ${Array.from({length:4},(_,i)=>`
        <div class="rune-particle" style="top:${10+i*20}%;left:${5+i*22}%;animation-delay:${i*0.8}s;color:${e.color}">
          ${'⬡⬢◈◉'.charAt(i)}

      `).join('')}
      
      <!-- Monster HP bar -->
      <div style="width:90%;max-width:320px;margin-bottom:8px">
        <div style="display:flex;justify-content:space-between;margin-bottom:3px">
          <span style="font-size:11px;color:rgba(255,100,100,0.8)">${e.monsterEmoji} Elemental Foe</span>
          <span style="font-size:11px;color:rgba(255,100,100,0.8)">${GS.monstHp}/${GS.maxMhp}</span>
        </div>
        <div class="hbar-track">
          <div class="hbar-fill" style="width:${mhpPct}%;background:linear-gradient(90deg,${mhpColor},${mhpColor}88)"></div>
        </div>
      </div>

      <!-- Sprites row -->
      <div style="display:flex;justify-content:space-around;align-items:flex-end;width:100%;margin-bottom:12px;padding:0 20px">
        <!-- Guardian -->
        <div style="display:flex;flex-direction:column;align-items:center;gap:4px">
          <div class="sprite-frame" style="border-color:${e.color}44" id="guardianSprite">
            <div style="font-size:52px;animation:guardianFloat 2s ease-in-out infinite;filter:drop-shadow(0 0 12px ${e.color})">${e.guardianEmoji}</div>
          </div>
          ${GS.combo>1?`<div style="font-size:9px;color:#FFD700;animation:bounce 0.5s ease-in-out infinite">🔥×${GS.combo}</div>`:''}
        </div>
        <!-- VS orb -->
        <div style="display:flex;flex-direction:column;align-items:center;gap:4px">
          <div class="elem-orb ${e.cssClass}" style="width:36px;height:36px;font-size:14px">${e.emoji}</div>
          <div style="font-size:9px;color:${e.color}66;letter-spacing:2px">VS</div>
        </div>
        <!-- Monster -->
        <div style="display:flex;flex-direction:column;align-items:center;gap:4px">
          <div class="sprite-frame" style="border-color:rgba(255,80,80,0.3)" id="monsterSprite">
            <div style="font-size:52px;animation:monsterBob 2.2s ease-in-out infinite;filter:drop-shadow(0 0 10px rgba(255,80,80,0.6));transform:scaleX(-1)">${e.monsterEmoji}</div>
          </div>
        </div>
      </div>

      <!-- Streak indicator -->
      ${GS.streak>0?`
      <div style="font-size:11px;color:#FFD700;margin-bottom:6px;animation:pulse 1s ease-in-out infinite">
        ${'⭐'.repeat(Math.min(GS.streak,5))} Streak: ${GS.streak}

      <!-- Question card -->
      <div style="background:rgba(0,0,0,0.55);border:1px solid ${e.color}33;border-radius:16px;padding:14px 18px;width:90%;max-width:340px;text-align:center;margin-bottom:10px;box-shadow:0 4px 20px rgba(0,0,0,0.5)">
        <div style="font-size:13px;color:${e.color}88;margin-bottom:6px;letter-spacing:1px">QUESTION ${GS.qIdx+1}</div>
        <div style="font-size:18px;color:#FFE4B5;line-height:1.4;min-height:40px;display:flex;align-items:center;justify-content:center">${q.q}</div>
      </div>

      <!-- Answer buttons -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;width:90%;max-width:340px">
        ${shuffled.map((ch,i)=>`
          <button id="ans_${i}" onclick="checkAnswer(this,'${ch.replace(/'/g,"\\'")}','${q.a.replace(/'/g,"\\'")}',${i})"
            style="background:rgba(${i===0?'139,0,0':i===1?'0,51,102':i===2?'27,94,32':'74,20,140'},0.6);
                   border:1px solid ${e.color}22;border-radius:12px;color:#FFE4B5;
                   padding:12px 8px;font-size:14px;line-height:1.2;
                   box-shadow:0 2px 8px rgba(0,0,0,0.3);

            ${ch}
          </button>
        `).join('')}
      </div>
      
      <!-- Flee button -->
      <button onclick="confirmFlee()" style="margin-top:10px;background:transparent;border:none;color:rgba(255,228,181,0.3);font-size:11px;letter-spacing:1px">
        ↩ Retreat
      </button>
    </div>
  </div>`);
}

// ============================================================
// CHECK ANSWER — Rev 8: Enhanced feedback with elemental effects
// ============================================================
function checkAnswer(btn, chosen, correct, idx){
  if(GS.answered) return;
  GS.answered = true;
  const isCorrect = chosen === correct;

  if(isCorrect){
    GS.streak++; GS.combo++;
    const dmg = 15 + (GS.combo>1?GS.combo*3:0);
    GS.monstHp = Math.max(0, GS.monstHp - dmg);
    const xpGain = 10 + GS.streak*2;
    GS.xp += xpGain; GS.coins += 3 + GS.streak;
    if(GS.xp >= GS.xpNeeded){ GS.playerLvl++; GS.xp=0; GS.xpNeeded=Math.floor(GS.xpNeeded*1.3); }
    btn.style.background = 'rgba(0,180,0,0.7)';
    btn.style.border = '2px solid #4CAF50';
    btn.style.transform = 'scale(1.05)';
    showFloatText('+'+dmg+'⚔️', '#FFD700');
  } else {
    GS.streak = 0; GS.combo = 0;
    GS.hp = Math.max(0, GS.hp - 18);
    btn.style.background = 'rgba(200,0,0,0.7)';
    btn.style.border = '2px solid #f44336';
    // Highlight correct
    document.querySelectorAll('[id^="ans_"]').forEach(b=>{
      if(b.textContent.trim()===correct){
        b.style.background='rgba(0,150,0,0.7)';
        b.style.border='2px solid #4CAF50';
      }
    });
    showFloatText('-18❤️','#f44336');
    // Shake
    const root = document.getElementById('battleRoot');
    if(root){ root.style.animation='shake 0.4s ease'; setTimeout(()=>{if(root)root.style.animation='';},400); }
  }

  // Disable all buttons
  document.querySelectorAll('[id^="ans_"]').forEach(b=>{ b.onclick=null; b.style.cursor='default'; });

  setTimeout(()=>{
    if(GS.hp<=0){ showDefeat(); return; }
    if(GS.monstHp<=0){ showVictory(); return; }
    GS.qIdx++;
    if(GS.qIdx >= GS.questions.length){ showVictory(); return; }
    showBattle();
  }, isCorrect?900:1200);
}

// Float damage text
function showFloatText(txt, color){
  const div = document.createElement('div');
  div.style.cssText = `position:fixed;top:45%;left:50%;transform:translate(-50%,-50%);font-size:26px;font-weight:bold;color:${color};pointer-events:none;z-index:999;animation:dmgFloat 0.9s ease forwards;text-shadow:0 2px 8px rgba(0,0,0,0.8)`;
  div.textContent = txt;
  document.body.appendChild(div);
  setTimeout(()=>div.remove(), 900);
}

// ============================================================
// VICTORY SCREEN — Rev 8: Burst effect
// ============================================================
function showVictory(){
  const e = GS.element;
  const stars = GS.hp>70?3:GS.hp>40?2:1;
  GS.totalCorrect = GS.questions.filter((_,i)=>i<GS.qIdx).length;
  render(`
  <div style="width:100%;height:100%;background:${e.bg};display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;overflow:hidden;position:relative">
    ${Array.from({length:12},(_,i)=>`<div style="position:absolute;width:8px;height:8px;background:${e.color};border-radius:50%;top:50%;left:50%;animation:victoryBurst 1s ease forwards;animation-delay:${i*0.1}s;transform-origin:${Math.cos(i/12*Math.PI*2)*60}px ${Math.sin(i/12*Math.PI*2)*60}px"></div>`).join('')}
    
    <div style="font-size:48px;animation:bounce 0.5s ease-in-out infinite;margin-bottom:10px">🏆</div>
    <div style="font-size:26px;color:#FFD700;letter-spacing:3px;margin-bottom:6px">VICTORY!</div>
    <div style="font-size:14px;color:${e.color};margin-bottom:20px">${e.emoji} ${e.name} World ${GS.world} Cleared!</div>
    
    <div style="font-size:32px;margin-bottom:16px">${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}</div>
    
    <div style="background:rgba(0,0,0,0.4);border:1px solid ${e.color}33;border-radius:14px;padding:16px 24px;margin-bottom:20px;text-align:center;min-width:220px">
      <div style="font-size:13px;color:${e.color}88;margin-bottom:10px;letter-spacing:1px">BATTLE RESULTS</div>
      <div style="display:flex;justify-content:space-between;gap:20px;font-size:13px;color:#FFE4B5">
        <span>❤️ HP Left: ${GS.hp}</span>
        <span>🪙 Coins: ${GS.coins}</span>
      </div>
      <div style="margin-top:8px;font-size:13px;color:#FFE4B5">⚡ Player Lv: ${GS.playerLvl}</div>
    </div>
    
    <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center">
      <button onclick="startGame(${Math.min(5,GS.world+1)})" style="background:linear-gradient(135deg,${e.darkColor},rgba(0,0,0,0.5));border:1px solid ${e.color}44;color:${e.color};padding:12px 22px;border-radius:24px;font-size:14px">
        ⚔️ Next World
      </button>

        🗺️ World Map
      </button>
      <button onclick="showTitle()" style="background:rgba(0,0,0,0.4);border:1px solid rgba(255,228,181,0.15);color:rgba(255,228,181,0.4);padding:12px 22px;border-radius:24px;font-size:14px">
        🏠 Home
      </button>
    </div>
  </div>`);
}

// ============================================================
// DEFEAT SCREEN

      <button onclick="showTitle()" style="background:rgba(0,0,0,0.4);border:1px solid rgba(255,228,181,0.15);color:rgba(255,228,181,0.4);padding:12px 22px;border-radius:24px;font-size:14px">

// ============================================================
// FLEE CONFIRM
// ============================================================
function confirmFlee(){
  const e = GS.element;
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.8);display:flex;align-items:center;justify-content:center;z-index:1000';
  overlay.innerHTML = `
    <div style="background:#1a1000;border:1px solid ${e.color}44;border-radius:16px;padding:24px;text-align:center;margin:20px">
      <div style="font-size:16px;color:#FFE4B5;margin-bottom:16px">Retreat from battle?</div>
      <div style="display:flex;gap:10px;justify-content:center">
        <button onclick="this.closest('[style*=fixed]').remove();showWorldSelect('${e.id}')" style="background:#8B0000;color:#FFE4B5;padding:10px 20px;border-radius:20px;font-size:14px">Yes, Retreat</button>
        <button onclick="this.closest('[style*=fixed]').remove()" style="background:rgba(255,255,255,0.1);color:#FFE4B5;padding:10px 20px;border-radius:20px;font-size:14px">Keep Fighting</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
}

// ============================================================
// BOOT
// ============================================================
showTitle();
</script>
