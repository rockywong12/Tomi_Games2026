// AUDIO ENGINE
// ═══════════════════════════════════
const SFX=(()=>{
  let ctx=null,loops=[],ambInt=null;
  function ac(){
    if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();
    if(ctx.state==='suspended')ctx.resume();
    return ctx;
  }
  function tone(freq,type,vol,dur,delay,pan){
    delay=delay||0;pan=pan||0;
    try{
      const c=ac(),o=c.createOscillator(),g=c.createGain();
      let src=o;
      if(c.createStereoPanner){const p=c.createStereoPanner();p.pan.value=pan;o.connect(p);p.connect(g);}
      else o.connect(g);
      o.type=type;o.frequency.value=freq;
      g.gain.setValueAtTime(0,c.currentTime+delay);
      g.gain.linearRampToValueAtTime(vol,c.currentTime+delay+0.02);
      g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+delay+dur);
      g.connect(c.destination);
      o.start(c.currentTime+delay);
      o.stop(c.currentTime+delay+dur+0.05);
    }catch(e){}
  }
  function stopAll(){loops.forEach(l=>{try{clearInterval(l)}catch(e){}});loops=[];clearInterval(ambInt);}
  function explore(){
    stopAll();
    const mel=[261.6,329.6,392,523.2,392,329.6,261.6,293.7];
    let i=0;
    const iv=setInterval(()=>{
      tone(mel[i%mel.length],'sine',0.055,0.45,0,-0.3);
      tone(mel[(i+2)%mel.length]*0.5,'triangle',0.035,0.65,0.12,0.3);
      if(i%4===0)tone(130.8,'sine',0.04,0.9);
      if(i%8===0)tone(196,'sine',0.03,0.7,0.2);
      i++;
    },440);
    loops.push(iv);
    ambInt=setInterval(()=>{
      tone(180+Math.random()*80,'sine',0.012,1.4,0,(Math.random()-.5)*.6);
    },900);
  }
  function battle(){
    stopAll();
    const riff=[220,246.9,220,196,220,261.6,246.9,220];
    let b=0;
    const iv=setInterval(()=>{
      if(b%2===0)tone(110,'sawtooth',0.08,0.12);
      if(b%4===0)tone(82.4,'square',0.09,0.18);
      tone(riff[b%riff.length],'sawtooth',0.05,0.22,0.04);
      tone(riff[(b+3)%riff.length]*1.5,'triangle',0.035,0.18,0.08);
      if(b%8===0)tone(440,'square',0.03,0.1,0.02);
      b++;
    },240);
    loops.push(iv);
  }
  function boss(){
    stopAll();
    const dr=[146.8,130.8,155.6,146.8,123.5,130.8,138.6,146.8];
    let b=0;
    const iv=setInterval(()=>{
      tone(dr[b%dr.length],'sawtooth',0.1,0.28);
      tone(dr[b%dr.length]*2,'square',0.055,0.18,0.04);
      if(b%3===0)tone(65.4,'sawtooth',0.12,0.38);
      if(b%6===0){for(let k=0;k<3;k++)tone(880+k*120,'square',0.038,0.1,k*0.05);}
      b++;
    },200);
    loops.push(iv);
  }
  function village(){
    stopAll();
    const folk=[392,440,493.9,523.2,493.9,440,392,349.2,392,440];
    let i=0;
    const iv=setInterval(()=>{
      tone(folk[i%folk.length],'triangle',0.065,0.55,0,0.2);
      tone(folk[(i+2)%folk.length]*0.5,'sine',0.04,0.7,0.15,-0.2);
      if(i%4===0)tone(196,'sine',0.035,0.75);
      i++;
    },520);
    loops.push(iv);
  }
  function victory(){
    stopAll();
    [[523.2,0],[659.3,.12],[783.9,.24],[1046.5,.36],[1318.5,.52]].forEach(([f,d])=>tone(f,'triangle',0.1,0.5,d));
    setTimeout(()=>{[[523.2,0],[659.3,.08],[1046.5,.18],[1318.5,.3],[2093,.45]].forEach(([f,d])=>tone(f,'sine',0.08,0.65,d));},650);
  }
  function defeat(){
    stopAll();
    [[440,0],[415.3,.18],[392,.36],[349.2,.54],[329.6,.72],[293.7,.95]].forEach(([f,d])=>tone(f,'sawtooth',0.07,0.45,d));
  }
  function correct(){tone(880,'sine',0.12,0.12);setTimeout(()=>tone(1100,'sine',0.1,0.12),90);}
  function wrong(){tone(200,'sawtooth',0.13,0.32);}
  function click(){tone(600,'sine',0.055,0.07);}
  function staff(){tone(320,'triangle',0.09,0.14);setTimeout(()=>tone(280,'sawtooth',0.07,0.1),55);}
  function monster(){tone(150,'sawtooth',0.13,0.22);setTimeout(()=>tone(120,'square',0.09,0.16),75);}
  function levelUp(){[523.2,659.3,783.9,1046.5,1318.5,1567.9].forEach((f,i)=>tone(f,'sine',0.1,0.3,i*.1));}
  return{explore,battle,boss,village,victory,defeat,correct,wrong,click,staff,monster,levelUp,stopAll};
})();

function save(){
  try{
    const qU={};
    Object.keys(G.qUsed).forEach(g=>{
      qU[g]={};
      Object.keys(G.qUsed[g]).forEach(l=>{qU[g][l]=[...G.qUsed[g][l]];});
    });
    localStorage.setItem("mte_v5",JSON.stringify({player:G.player,path:G.path,currentNodeId:G.currentNodeId,monstersKilled:G.monstersKilled,stage:G.stage,level:G.level,qUsed:qU}));
  }catch(e){}
}
function loadSave(){
  try{
    const s=localStorage.getItem("mte_v5");
    if(!s)return null;
    const d=JSON.parse(s);
    // Reconstitute sets
    const qU={};
    if(d.qUsed){Object.keys(d.qUsed).forEach(g=>{qU[g]={};Object.keys(d.qUsed[g]).forEach(l=>{qU[g][l]=new Set(d.qUsed[g][l]);});});}
    d.qUsed=qU;
    return d;
  }catch(e){return null;}
}

  if(!G.qUsed[g][l])G.qUsed[g][l]=new Set();
  const pool=(ALL_QUESTIONS[grade]||ALL_QUESTIONS[7])[level]||[];
  let available=pool.map((_,i)=>i).filter(i=>!G.qUsed[g][l].has(i));
  if(available.length===0){G.qUsed[g][l]=new Set();available=pool.map((_,i)=>i);}
  const idx=available[Math.floor(Math.random()*available.length)];
  G.qUsed[g][l].add(idx);
  const q=pool[idx];
  // shuffle choices
  const chs=[...q.ch].sort(()=>Math.random()-.5);
  return{...q,ch:chs};
}

function getEl(e){return EL[e]||EL.fire;}
function getMonster(id){return MONSTERS.find(m=>m.id===id)||MONSTERS[0];}
function getVillage(id){return VILLAGES.find(v=>v.id===id);}
function getNode(id){return ALL_NODES[id];}
function getAvatar(p){return p?AVATARS[p.gender||"male"][p.element||"fire"]:{n:"Hero",t:"Adventurer"};}
function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a;}

const app=document.getElementById("app");
function h(tag,attrs,children){
  attrs=attrs||{};children=children||[];
  const el=document.createElement(tag);
  for(const[k,v] of Object.entries(attrs)){
    if(k==="style"&&typeof v==="object")Object.assign(el.style,v);
    else if(k.startsWith("on")&&typeof v==="function")el.addEventListener(k.slice(2).toLowerCase(),v);
    else el.setAttribute(k,v);
  }
  for(const c of[].concat(children)){
    if(c==null||c===false||c===undefined)continue;
    el.appendChild(typeof c==="string"?document.createTextNode(c):c);
  }
  return el;
}
function hbar(label,cur,max,color,glow){
  const pct=Math.max(0,Math.min(100,(cur/max)*100));
  return h("div",{style:{marginBottom:"5px"}},[
    h("div",{class:"hbar-label"},[h("span",{},[label]),h("span",{},[Math.ceil(cur)+"/"+max])]),
    h("div",{class:"hbar-track"},[h("div",{class:"hbar-fill",style:{width:pct+"%",background:color,boxShadow:"0 0 6px "+glow}})])
  ]);
}
function render(){
  app.innerHTML="";

  if(s==="loading")return renderLoading();
  if(s==="create")return renderCreate();
  if(s==="main")return renderMain();
  if(s==="combat")return renderCombat();
  if(s==="village")return renderVillage();
  if(s==="result")return renderResult();
  if(s==="branch")return renderBranch();
  if(s==="boss_victory")return renderBossVictory();
  if(s==="ad")return renderAd();
}

function handleNodeAction(node){
  if(node.type==="start"){const ni=DEFAULT_PATH[1];G.path=[0,ni];G.currentNodeId=ni;save();render();return;}
  if(node.type==="village"){G.activeVillage=getVillage(node.vid);G.screen="village";SFX.village();render();return;}
  if(node.type==="treasure"){G.player.gold+=35;G.result={won:true,xp:0,treasure:true};G.screen="result";SFX.victory();render();return;}
  if(node.type==="monster"||node.type==="boss"){
    const m=getMonster(node.mid);
    G.combat={monster:{...m,curHp:m.hp},question:getQ(G.player.grade,G.level),selected:null,result:null,showHint:false,paused:false,playerHp:G.player.energy,streak:0,turn:0,dmgText:null,dmgSide:null,monsterTurn:false};
    G.screen="combat";
    if(node.boss||node.final)SFX.boss();else SFX.battle();
    render();return;
  }
}

function advanceOrBranch(){
  const branches=BRANCH_MAP[G.currentNodeId];
  if(branches){G.pendingBranch=branches;G.screen="branch";save();render();}
  else{
    const ci=DEFAULT_PATH.indexOf(G.currentNodeId);
    const ni=ci>=0?DEFAULT_PATH[ci+1]:null;
    if(ni!=null){
      G.path=[...G.path,ni];G.currentNodeId=ni;
      // Advance level counter
      G.level=Math.min(5,Math.ceil(G.path.length/2));
      save();SFX.explore();render();
    }else{G.screen="boss_victory";render();}
  }
}

    document.head.appendChild(st);
  }
}

function handleAnswer(idx,choice){
  const cb=G.combat;const p=G.player;
  const correct=choice===cb.question.a;
  cb.selected=idx;
  if(correct){
    SFX.correct();SFX.staff();
    const pathBonus=p.path==="warrior"?5:0;
    const sm=p.path==="rogue"?2:1;
    const dmg=15+cb.streak*3*sm+pathBonus;
    cb.monster.curHp=Math.max(0,cb.monster.curHp-dmg);
    cb.result="correct";cb.streak++;
    cb.dmgText="-"+dmg;cb.dmgSide="monster";
    if(p.path==="healer"){G.player.energy=Math.min(p.maxEnergy,p.energy+2);cb.playerHp=Math.min(p.maxEnergy,cb.playerHp+2);}
    render();
    if(cb.monster.curHp<=0){
      SFX.victory();
      setTimeout(()=>{G.player.gold+=cb.monster.xp;G.player.energy=cb.playerHp;G.monstersKilled++;G.result={won:true,xp:cb.monster.xp};G.screen="result";G.combat=null;save();render();},1300);
    }else{setTimeout(()=>nextTurn(),1400);}
  }else{
    // Wrong answer → monster attacks
    SFX.wrong();
    cb.result="wrong";cb.streak=0;
    cb.dmgText=null;cb.dmgSide=null;
    render();
    setTimeout(()=>{
      cb.monsterTurn=true;
      const dmg=rand(cb.monster.atkMin||5,cb.monster.atkMax||15);
      cb.playerHp=Math.max(0,cb.playerHp-dmg);
      cb.dmgText="-"+dmg;cb.dmgSide="player";
      SFX.monster();
      render();
      if(cb.playerHp<=0){
        SFX.defeat();
        setTimeout(()=>{G.player.energy=0;G.result={won:false,xp:0};G.screen="result";G.combat=null;save();render();},1500);
      }else{setTimeout(()=>nextTurn(),1600);}
    },850);
  }
}

function nextTurn(){
  const cb=G.combat;if(!cb)return;
  cb.result=null;cb.selected=null;cb.showHint=false;cb.dmgText=null;cb.dmgSide=null;cb.monsterTurn=false;
  cb.turn++;cb.question=getQ(G.player.grade,G.level);
  G.player.energy=cb.playerHp;
  render();
}

  const stats=h("div",{style:{background:"rgba(255,215,0,.08)",border:"1px solid rgba(255,215,0,.25)",borderRadius:"12px",padding:"16px 22px",marginBottom:"22px",width:"100%",maxWidth:"280px",position:"relative",zIndex:"1"}});

  [["Monsters Defeated",G.monstersKilled,"#90EE90"],["Gold Collected",p.gold,"#FFD700"],["Energy Remaining",p.energy+"/"+p.maxEnergy,p.energy>8?"#90EE90":"#FF6B35"],["Stage Completed","Stage "+G.stage,"#C080FF"]].forEach(([l,v,c])=>{
    stats.appendChild(h("div",{style:{display:"flex",justifyContent:"space-between",fontSize:"13px",color:"#C0A060",marginBottom:"4px"}},[h("span",{},[l+":"]),h("span",{style:{color:c,fontWeight:"700"}},[String(v)])]));
  });
  div.appendChild(stats);
  const nb=h("button",{style:{padding:"15px 36px",borderRadius:"12px",background:`linear-gradient(135deg,${el.c},${el.g})`,border:"none",color:"#000",cursor:"pointer",fontWeight:"700",fontSize:"16px",boxShadow:`0 0 22px ${el.g}77`,marginBottom:"12px",position:"relative",zIndex:"1"}},["⚔️ Begin Stage "+(G.stage+1)]);
  nb.addEventListener("click",()=>{
    G.stage++;G.level=1;G.path=[0];G.currentNodeId=0;initQUsed();
    G.screen="main";SFX.explore();save();render();
  });
  const mb=h("button",{style:{padding:"11px 26px",borderRadius:"10px",background:"rgba(255,255,255,.06)",border:"1px solid rgba(255,255,255,.18)",color:"#aaa",cursor:"pointer",fontSize:"13px",position:"relative",zIndex:"1"}},["🏠 Main Menu"]);
  mb.addEventListener("click",()=>{CC={step:0,name:"",gender:null,element:null,path:null,grade:null};G.screen="create";render();});
  div.appendChild(nb);div.appendChild(mb);app.appendChild(div);
}

// ═══════════════════════════════════
// AD SCREEN
// ═══════════════════════════════════
function renderAd(){
  SFX.stopAll();
  let cd=5;
  const div=h("div",{style:{position:"absolute",inset:"0",background:"#000",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",zIndex:"200"}});
  div.appendChild(h("div",{style:{position:"absolute",top:"12px",right:"14px",color:"#444",fontSize:"11px",letterSpacing:"1px"}},["ADVERTISEMENT"]));
  const ab=h("div",{style:{width:"90%",maxWidth:"360px",background:"linear-gradient(135deg,#0a0030,#002044)",borderRadius:"18px",display:"flex",flexDirection:"column",alignItems:"center",gap:"14px",padding:"48px 28px",border:"2px solid rgba(100,150,255,.2)",minHeight:"320px"}});
  ab.appendChild(h("div",{style:{fontSize:"52px"}},["🏰"]));
  ab.appendChild(h("div",{style:{fontSize:"22px",color:"#FFD700",fontWeight:"700",textAlign:"center"}},["Epic Quest Awaits!"]));
  ab.appendChild(h("div",{style:{fontSize:"13px",color:"#aaa",textAlign:"center",lineHeight:"1.6"}},["Expand your adventure across new realms. More stages, more monsters, more math mastery!"]));
  ab.appendChild(h("div",{style:{padding:"12px 28px",borderRadius:"24px",background:"linear-gradient(135deg,#FF6B35,#FFD700)",color:"#000",fontWeight:"700",fontSize:"15px"}},["Play Now →"]));
  div.appendChild(ab);
  const sw=h("div",{style:{marginTop:"20px",minHeight:"40px",display:"flex",alignItems:"center",justifyContent:"center"}});
  const sl=h("div",{style:{color:"#444",fontSize:"13px"}},["Skip in 5s..."]);
  sw.appendChild(sl);div.appendChild(sw);app.appendChild(div);
  const iv=setInterval(()=>{
    cd--;
    if(cd<=0){
      clearInterval(iv);sw.innerHTML="";
      const sb=h("button",{style:{padding:"11px 30px",borderRadius:"8px",background:"rgba(255,255,255,.12)",border:"1px solid rgba(255,255,255,.25)",color:"#fff",cursor:"pointer",fontSize:"14px"}},["✕ Close Ad"]);
      sb.addEventListener("click",()=>{G.screen="main";SFX.explore();advanceOrBranch();});
      sw.appendChild(sb);
    }else{sl.textContent="Skip in "+cd+"s...";}
  },1000);
}

// ═══════════════════════════════════
// INVENTORY
// ═══════════════════════════════════
function renderInventory(){
  const p=G.player;const el=getEl(p.element);
  const ov=h("div",{style:{position:"absolute",inset:"0",background:"rgba(0,0,0,.88)",backdropFilter:"blur(6px)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:"90",padding:"16px"}});
  const card=h("div",{class:"card",style:{border:`1px solid ${el.c}55`,maxWidth:"380px",width:"100%",maxHeight:"85vh",overflowY:"auto"}});
  const hd=h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"16px"}});
  hd.appendChild(h("div",{style:{fontSize:"17px",fontWeight:"700",color:el.c}},["🎒 Inventory & Stats"]));
  const cb=h("button",{style:{padding:"4px 10px",borderRadius:"6px",background:"rgba(255,255,255,.08)",border:"1px solid rgba(255,255,255,.15)",color:"#aaa",cursor:"pointer",fontSize:"13px"}},["✕"]);
  cb.addEventListener("click",()=>{G.showInventory=false;SFX.click();render();});
  hd.appendChild(cb);card.appendChild(hd);
  const pd=PATHS[p.path];
  card.appendChild(h("div",{style:{padding:"10px 12px",borderRadius:"10px",background:`${el.c}18`,border:`1px solid ${el.c}33`,marginBottom:"12px"}},[h("div",{style:{display:"flex",alignItems:"center",gap:"8px"}},[h("span",{style:{fontSize:"22px"}},[pd?.icon||"⚔️"]),h("div",{},[h("div",{style:{fontWeight:"700",fontSize:"13px",color:el.c}},[pd?.label+" Path"]),h("div",{style:{fontSize:"11px",color:"#888"}},[pd?.bonus])])])]));
  card.appendChild(h("div",{style:{color:"#C0A060",fontSize:"12px",marginBottom:"8px"}},["🎭 Disguises ("+p.disguises.length+")"]));
  if(p.disguises.length>0){p.disguises.forEach(did=>{const d=DISGUISES.find(x=>x.id===did);if(d)card.appendChild(h("div",{style:{display:"flex",alignItems:"center",gap:"8px",padding:"7px 10px",borderRadius:"8px",background:"rgba(255,215,0,.06)",border:"1px solid rgba(255,215,0,.14)",marginBottom:"5px"}},[h("span",{style:{fontSize:"20px"}},[d.s]),h("div",{},[h("div",{style:{fontSize:"12px",color:"#FFE4B5"}},[d.n]),h("div",{style:{fontSize:"10px",color:"#888"}},["Entry to "+EL[d.el].name+" villages"])])]));});}
  else card.appendChild(h("div",{style:{color:"#444",fontSize:"11px",fontStyle:"italic",marginBottom:"8px"}},["No disguises found yet"]));
  card.appendChild(h("div",{style:{padding:"10px 12px",borderRadius:"10px",background:"rgba(255,255,255,.04)",border:"1px solid rgba(255,255,255,.08)",marginTop:"8px"}},[
    h("div",{style:{color:"#aaa",fontSize:"11px",marginBottom:"6px"}},["📊 Adventure Stats"]),
    ...[["Stage",G.stage,"#C080FF"],["Level",G.level,el.c],["Monsters Defeated",G.monstersKilled,"#90EE90"],["Gold",p.gold,"#FFD700"],["Energy",`${p.energy}/${p.maxEnergy}`,p.energy>8?"#90EE90":"#FF6B35"],["Grade","Grade "+p.grade,"#C0A060"]].map(([l,v,c])=>h("div",{style:{display:"flex",justifyContent:"space-between",fontSize:"12px",color:"#888",marginBottom:"3px"}},[h("span",{},[l+":"]),h("span",{style:{color:c}},[String(v)])]))
  ]));
  ov.appendChild(card);app.appendChild(ov);
}

// ═══════════════════════════════════
// BOOT
// ═══════════════════════════════════
render();
</script>
